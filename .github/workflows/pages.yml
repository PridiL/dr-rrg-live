# DR RRG daily refresh, Mon-Fri 07:30 Bangkok, on GitHub's servers (laptop on or off).
#
# Publishes to GitHub Pages (https://pridil.github.io/dr-rrg-live/rrg.html). The page
# people use is https://yuantaresearch-dr-dashboard.netlify.app/rrg.html: Netlify
# serves it from here through a rewrite rule deployed once with the DR Dashboard, so
# a daily update costs NO Netlify deploy credits. (Deploying to Netlify every weekday
# needed 22 x 15 credits a month - more than the free plan's 300 - and a team that runs
# out has every site paused until the next billing cycle.)
#
# Steps: build (retry while MSCI World lags) -> session check -> privacy scan ->
# add the tab bar -> publish to Pages -> confirm the Netlify URL shows this build.
# Fails (red run + GitHub email) on any error, or when a market is missing the
# previous trading day (that case still publishes first). Uses no secrets.
#
# WHAT STARTS IT: GitHub's own schedule proved useless for a 07:30 deadline here (Wed
# 2026-10-28 the 07:30 run started at 12:59; Thu 10-29 neither cron had started by 09:49).
# So an external scheduler (cron-job.org, user's account) calls the workflow_dispatch API
# on time: 07:30 Bangkok -> build; 08:15 -> backup=true (builds only if today's page is
# missing). The crons below stay as a last resort and are gated the same way, so a run
# that arrives hours late does nothing once today's page is up.
name: DR RRG daily
on:
  schedule:
    - cron: "30 0 * * 1-5"      # 00:30 UTC = 07:30 Bangkok, Monday-Friday
    - cron: "15 1 * * 1-5"      # 08:15 Bangkok
  workflow_dispatch:
    inputs:
      backup:
        description: "Backup call: build only if the page does not already show today's build"
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: dr-rrg-pages
  cancel-in-progress: false
env:
  TZ: Asia/Bangkok              # the builders drop bars dated "today" - Bangkok's today
  PYTHONIOENCODING: utf-8
  NETLIFY_URL: https://yuantaresearch-dr-dashboard.netlify.app
  GITHUB_DR_URL: https://pridil.github.io/dr-dashboard/
  PAGES_URL: https://pridil.github.io/dr-rrg-live/rrg.html
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          # A run-now call (cron-job.org's 07:30 call, or a manual run) always builds.
          # Backup calls and GitHub's own (often hours-late) schedule build only if
          # today's page is missing.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.backup }}" != "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "run-now call - building"; exit 0
          fi
          today=$(date +%F)    # Bangkok date (TZ above)
          have=$(curl -s "$PAGES_URL?v=$RANDOM$RANDOM" | grep -o 'built [0-9-]*' | head -1)
          echo "${{ github.event_name }} backup check: page shows '$have', today is $today"
          if [ "$have" = "built $today" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "Today's build is already published - nothing to do."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "Today's page is missing - building now."
          fi

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      sessions: ${{ steps.sessions.outputs.code }}
      stamp: ${{ steps.site.outputs.stamp }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r requirements.txt

      - name: Build (retry on a failed build, or while MSCI World lags the previous weekday)
        working-directory: DR RRG
        run: |
          # A build can fail on a passing Yahoo/yfinance hiccup (2026-10-27: "database is
          # locked" on 000001.SS); the builders then refuse to write, so just try again.
          ok=0
          for try in 1 2 3 4; do
            if python build_country_rrg.py && python build_rrg_table.py && python combine_rrg.py; then
              ok=1
              read world want < <(python -c "import json,datetime as d,check_sessions as c; print(json.load(open('country_rrg_data.json'))['meta']['world_last'], c.expected_session(d.date.today()))")
              echo "MSCI World newest level $world (want $want)"
              if [[ ! "$world" < "$want" ]]; then break; fi
              msg="MSCI World still at $world"; wait=900
            else
              ok=0; msg="build failed"; wait=120
            fi
            if [ $try -lt 4 ]; then echo "$msg - retrying in $wait s ($try/4)"; sleep $wait; fi
          done
          [ $ok -eq 1 ] || { echo "::error::build failed 4 times - nothing published"; exit 1; }
          [[ ! "$world" < "$want" ]] || echo "::warning::MSCI World still at $world - publishing; countries graph sits a day behind"

      - name: Session check (previous trading day for every market)
        id: sessions
        working-directory: DR RRG
        run: |
          set +e
          python check_sessions.py; code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ $code -eq 4 ] && echo "::warning::a market is missing the previous trading day - see the WARNING lines"
          [ $code -eq 0 ] || [ $code -eq 4 ]

      - name: Privacy scan
        run: python tools/privacy_scan.py "DR RRG/dr_rrg_combined.html"

      - name: Assemble the Pages site
        id: site
        run: |
          mkdir -p site
          python "DR Dashboard/netlify_nav.py" site "DR RRG/dr_rrg_combined.html"
          # The Netlify address is the official one: say so to search engines.
          sed -i "s#</head>#<link rel=\"canonical\" href=\"$NETLIFY_URL/rrg.html\">\n</head>#" site/rrg.html
          # The page's "DR Dashboard" tab links to ./ - on Netlify that is the DR dashboard;
          # here it is this stub, which hands over to the GitHub copy of the DR dashboard.
          printf '<!DOCTYPE html><meta charset="utf-8"><title>DR Dashboard</title><meta http-equiv="refresh" content="0; url=%s"><link rel="canonical" href="%s/"><p><a href="%s">%s</a></p>\n' "$GITHUB_DR_URL" "$NETLIFY_URL" "$GITHUB_DR_URL" "$GITHUB_DR_URL" > site/index.html
          touch site/.nojekyll
          echo "stamp=$(grep -o 'built [0-9: -]*[0-9]' site/rrg.html | head -1)" >> "$GITHUB_OUTPUT"
          ls -la site

      - uses: actions/upload-pages-artifact@v3
        with: { path: site }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dr-rrg-${{ github.run_id }}
          retention-days: 14
          path: |
            DR RRG/dr_rrg_combined.html
            DR RRG/country_rrg_data.json
            DR RRG/rrg_table_data.json

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}rrg.html
    steps:
      - id: pages
        uses: actions/deploy-pages@v4

  verify:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the Netlify URL shows this build
        run: |
          # GitHub Pages lets caches keep a page ~10 minutes, so allow up to 15.
          want="${{ needs.build.outputs.stamp }}"
          for i in $(seq 1 30); do
            body=$(curl -s "$NETLIFY_URL/rrg.html?v=$RANDOM$RANDOM")
            if grep -q "$want" <<<"$body" && grep -q 'class="yr-nav"' <<<"$body"; then
              echo "OK: $NETLIFY_URL/rrg.html shows '$want' with the tab bar"; exit 0
            fi
            sleep 30
          done
          echo "::error::$NETLIFY_URL/rrg.html did not show '$want' within 15 minutes"; exit 1
      - name: Fail the run if a market missed the previous trading day
        if: needs.build.outputs.sessions == '4'
        run: |
          echo "Published, but at least one market is missing the previous trading day (see the build job's 'Session check')."
          exit 1
